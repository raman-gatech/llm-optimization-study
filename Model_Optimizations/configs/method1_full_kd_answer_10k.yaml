method: method1_full_kd

student_model_name: meta-llama/Llama-3.2-3B
teacher_model_name: meta-llama/Llama-3.1-8B

output_dir: outputs/method1_full_kd_answer_10k
seed: 42
max_length: 1024

batch_size: 1
eval_batch_size: 1
gradient_accumulation_steps: 16
num_workers: 2

lr: 1.0e-5
weight_decay: 0.01
warmup_ratio: 0.05
max_grad_norm: 1.0

max_steps: 10000
val_ratio: 0.05

log_every: 25
eval_every: 500
save_every: 500

kd_temperature: 2.0
kd_alpha: 0.2
kd_on_final_answer_only: true

eval_max_new_tokens: 256
eval_do_sample: false
eval_temperature: 1.0
eval_top_p: 1.0
eval_test_limit: null
