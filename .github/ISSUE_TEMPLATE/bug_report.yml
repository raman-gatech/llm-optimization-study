name: Bug report
description: Report a reproducible defect in training, benchmarking, analysis, or the site.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction command
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include OS, Python, CUDA, GPU, PyTorch, Transformers, and vLLM versions as relevant.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or result artifact
