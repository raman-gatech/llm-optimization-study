server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/json application/javascript image/svg+xml text/css text/csv;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location = /index.html {
    expires -1;
  }

  location ~* \.(?:css|js|svg|png|pdf|csv)$ {
    expires 1h;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
