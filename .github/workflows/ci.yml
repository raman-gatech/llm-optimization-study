name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[analysis,test,dev]'
      - run: python -m ruff check llm_optimization analysis/export_results.py scripts tests
      - run: python -m mypy llm_optimization analysis/export_results.py scripts
      - run: python -m pytest
      - run: python -m compileall -q llm_optimization Model_Optimizations/src analysis scripts tests
      - run: find . -type f \( -name '*.sh' -o -name '*.slurm' \) -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - run: python analysis/export_results.py --output-dir /tmp/results
      - run: diff -u results/summary.json /tmp/results/summary.json
      - run: python scripts/build_site.py --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-site-py${{ matrix.python-version }}
          path: dist

  torch-losses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest --cov=llm_optimization --cov-report=term-missing --cov-fail-under=90

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: llm-optimization-portfolio:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
