[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-optimization-study"
version = "1.0.0"
description = "Reproducible model- and runtime-optimization experiments for Llama inference"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Ramanathan Swaminathan" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://raman-gatech.github.io/llm-optimization-study/"
Repository = "https://github.com/raman-gatech/llm-optimization-study"
Issues = "https://github.com/raman-gatech/llm-optimization-study/issues"

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2.3,<3",
]
training = [
  "accelerate>=1.0,<2",
  "datasets>=4.0,<5",
  "evaluate>=0.4,<1",
  "PyYAML>=6,<7",
  "rouge-score>=0.1,<1",
  "torch>=2.7,<3",
  "tqdm>=4.67,<5",
  "transformers>=4.57,<5",
]
test = [
  "PyYAML>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]
dev = [
  "mypy>=1.15,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["llm_optimization*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "torch: requires PyTorch",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  "Model_Optimizations/env",
  "bench/bench_results",
  "help",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_site_packages = true
